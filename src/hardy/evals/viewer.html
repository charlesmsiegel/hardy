<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardy corpus</title>
<!-- The page holds a working corpus, which may be unpublished: `--corpus` can
     point at any authoring tree. So the three files it fetches from a CDN are
     pinned by digest, and the policy below denies everything the page does not
     need -- above all `connect-src 'self'`, so a script that arrived here
     anyway has nowhere to send `/api/corpus`. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  font-src https://cdn.jsdelivr.net;
  img-src 'self' data:;
  connect-src 'self';
  base-uri 'none';
  form-action 'none'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
        integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
        crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --dim: #6b6b66; --line: #e3e3df;
    --accent: #2f5d8a; --ok: #1f6f43; --bad: #a8321f; --warn: #8a5a12;
    --code-bg: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a; --panel: #1c1e23; --ink: #e6e6e3; --dim: #9a9a94; --line: #2e3138;
      --accent: #7aa8d4; --ok: #66c08c; --bad: #e8846f; --warn: #d6a55a;
      --code-bg: #22252b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header {
    padding: .7rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 1rem; font-weight: 650; letter-spacing: -.01em; }
  header .ver { color: var(--dim); font-size: .82rem; }
  header .counts { margin-left: auto; color: var(--dim); font-size: .82rem; }
  header .counts b { color: var(--ink); font-weight: 600; }
  #status { padding: .5rem 1rem; font-size: .85rem; border-bottom: 1px solid var(--line); }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
  #status ul { margin: .4rem 0 0; padding-left: 1.1rem; }
  main { display: grid; grid-template-columns: minmax(260px, 30%) 1fr; min-height: calc(100vh - 96px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } #list { max-height: 40vh; } }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .filters { padding: .6rem; border-bottom: 1px solid var(--line); display: grid; gap: .4rem; }
  .filters input, .filters select {
    width: 100%; padding: .35rem .5rem; font: inherit; font-size: .85rem;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
  }
  .filters .row { display: flex; gap: .4rem; }
  .item {
    padding: .5rem .7rem; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; gap: .15rem;
  }
  .item:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .item .id { font-size: .84rem; font-weight: 600; }
  .item .meta { font-size: .74rem; color: var(--dim); display: flex; gap: .45rem; flex-wrap: wrap; }
  .tag {
    font-size: .68rem; padding: .05rem .32rem; border-radius: 4px; border: 1px solid var(--line);
    color: var(--dim); white-space: nowrap;
  }
  .tag.false { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .tag.active { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  #detail { padding: 1.1rem 1.3rem 4rem; overflow-y: auto; }
  #detail h2 { margin: 0 0 .1rem; font-size: 1.15rem; }
  #detail .sub { color: var(--dim); font-size: .82rem; margin-bottom: 1.1rem; }
  .pane { margin-bottom: 1.15rem; }
  .pane > h3 {
    margin: 0 0 .35rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); font-weight: 650;
  }
  .statement {
    font-size: 1.02rem; padding: .7rem .85rem; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 5px;
  }
  pre.lean {
    margin: 0; padding: .7rem .85rem; background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 5px; font-size: .84rem; overflow-x: auto; white-space: pre-wrap;
    word-break: break-word;
  }
  table.kv { border-collapse: collapse; width: 100%; font-size: .87rem; }
  table.kv td { padding: .25rem .5rem .25rem 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.kv td:first-child { color: var(--dim); width: 8.5rem; white-space: nowrap; }
  .none { color: var(--dim); font-style: italic; }
  .warnline { color: var(--warn); }
  header .nav { color: var(--accent); font-size: .85rem; }
  header .reviewer { color: var(--dim); font-size: .82rem; display: flex; gap: .4rem; align-items: baseline; }
  header .reviewer input {
    font: inherit; font-size: .85rem; padding: .15rem .45rem; width: 12rem;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 5px;
  }
  header .reviewer input:placeholder-shown { border-color: var(--warn); }
  .verdicts { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .6rem; align-items: center; }
  .verdicts button {
    font: inherit; font-size: .85rem; padding: .35rem .8rem; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .verdicts button.faithful { border-color: var(--ok); color: var(--ok); }
  .verdicts button.unfaithful { border-color: var(--bad); color: var(--bad); }
  .verdicts button:disabled { opacity: .45; cursor: not-allowed; }
  .verdicts .hint { color: var(--dim); font-size: .8rem; }
  #status.pending { color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
  footer { padding: .6rem 1rem; color: var(--dim); font-size: .76rem; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Hardy corpus</h1>
  <span class="ver" id="version"></span>
  <a class="nav" href="/bibliography">bibliography</a>
  <label class="reviewer">reviewing as
    <input id="reviewer" type="text" placeholder="your name" autocomplete="name" spellcheck="false">
  </label>
  <span class="counts" id="counts"></span>
</header>
<div id="status">loading…</div>
<main>
  <div id="list">
    <div class="filters">
      <input id="q" type="search" placeholder="Search id, statement, Lean, title…" autocomplete="off">
      <div class="row">
        <select id="fGroup"><option value="">every group</option></select>
        <select id="fStatus"><option value="">every status</option></select>
      </div>
      <div class="row">
        <select id="fDifficulty"><option value="">every difficulty</option></select>
        <select id="fExpected">
          <option value="">true and twins</option>
          <option value="true">true only</option>
          <option value="false">twins only</option>
        </select>
      </div>
    </div>
    <div id="items"></div>
  </div>
  <div id="detail"><p class="none">Select an entry.</p></div>
</main>
<footer id="foot"></footer>

<script>
let DATA = { entries: [], issues: [], counts: {}, sources: {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderMath(el) {
  // Rendered if KaTeX loaded; the raw LaTeX stays readable if the CDN is
  // unreachable, which is the offline case this tool should survive.
  if (!window.renderMathInElement) return;
  try {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
      ],
      throwOnError: false,
    });
  } catch (_) { /* leave the source visible */ }
}

function fillSelect(el, values) {
  const keep = el.value;
  el.length = 1;
  for (const v of values) el.add(new Option(v, v));
  el.value = keep;
}

function matches(e) {
  const q = $("q").value.trim().toLowerCase();
  if ($("fGroup").value && e.group !== $("fGroup").value) return false;
  if ($("fStatus").value && e.status !== $("fStatus").value) return false;
  if ($("fDifficulty").value && e.difficulty !== $("fDifficulty").value) return false;
  if ($("fExpected").value && e.expected !== $("fExpected").value) return false;
  if (!q) return true;
  return [e.id, e.input, e.title, e.declaration, e.name, ...e.msc.map((m) => m.code + " " + m.name)]
    .join(" ").toLowerCase().includes(q);
}

function renderList() {
  const shown = DATA.entries.filter(matches);
  const current = location.hash.slice(1);
  $("items").innerHTML = shown.map((e) => `
    <div class="item" data-id="${esc(e.id)}" aria-current="${e.id === current}">
      <span class="id">${esc(e.id)}</span>
      <span class="meta">
        <span class="tag">${esc(e.msc[0].code)}</span>
        <span class="tag">${esc(e.group)}</span>
        ${e.expected === "false" ? '<span class="tag false">twin</span>' : ""}
        ${e.status === "active" ? '<span class="tag active">active</span>' : `<span class="tag">${esc(e.status)}</span>`}
      </span>
    </div>`).join("") || '<p class="none" style="padding:.8rem">Nothing matches.</p>';
  for (const el of $("items").children) {
    if (el.dataset.id) el.onclick = () => { location.hash = el.dataset.id; };
  }
  $("foot").textContent =
    `${shown.length} of ${DATA.entries.length} shown · read from disk at ${DATA.generated_at} · refresh to re-read`;
}

function pane(title, html) { return `<div class="pane"><h3>${title}</h3>${html}</div>`; }

function renderDetail() {
  const id = location.hash.slice(1);
  const e = DATA.entries.find((x) => x.id === id);
  const box = $("detail");
  // The list is redrawn on both paths: it carries the selection highlight, so
  // it is out of date whenever the detail pane is, and on first load -- no
  // hash, so no entry -- returning early here left the page showing nothing
  // at all until something happened to redraw it.
  if (!e) {
    box.innerHTML = '<p class="none">Select an entry.</p>';
    renderList();
    return;
  }

  const codes = e.msc.map((m) =>
    `<div><code>${esc(m.code)}</code> &nbsp;${esc(m.name)}</div>`).join("");
  // The citation is built server-side from the source record, so the label
  // and locator text here match the bibliography page by construction.
  const occ = e.occurrences.length
    ? e.occurrences.map((o, i) => {
        const src = DATA.sources[o.source_id];
        const label = `[<a href="/bibliography#${esc(o.citation.key)}">${esc(o.citation.key)}</a>, ${esc(o.citation.locator)}]`;
        const missing = src ? "" : ` <span class="warnline">(${esc(o.source_id)} is not in sources.json)</span>`;
        return `<div>${i === 0 ? "<b>primary</b> · " : ""}<span class="mono">${label}</span>${missing}</div>`;
      }).join("")
    : `<p class="none">No occurrences. Authored entry — rationale: ${esc(e.rationale) || '<span class="warnline">missing</span>'}</p>`;
  // `e.unwitnessed`, not `e.witness`: A6 has nothing to close when an entry
  // has no binders, so a term stored there was never checked against anything.
  // Branching on the field would show it as evidence while the header counted
  // the entry unwitnessed -- two panels disagreeing about the same statement.
  const stored = e.witness
    ? ` The stored term <code class="mono">${esc(e.witness)}</code> proves nothing here: there are no binders for it to instantiate.`
    : "";
  const witness = !e.unwitnessed
    ? `<p>The hypotheses can all hold at once: this term picks a value for every binder and proves each
         hypothesis about it, and Lean's kernel checked it. The theorem is therefore not true merely
         because its premises are impossible.</p>
       <pre class="lean">${esc(e.witness)}</pre>`
    : `<p class="none">Not checked mechanically — ${esc(e.witness_note) || "no note."}${stored}</p>
       <p class="none">A theorem whose hypotheses can never all hold is provable for free, so a statement
         that has not been shown non-vacuous could score as solved while saying nothing. Only the human
         read rules that out here: confirm the instance named above really satisfies every hypothesis.</p>`;
  const recorded = e.review
    ? `<table class="kv"><tr><td>reviewer</td><td>${esc(e.review.reviewer)}</td></tr>
       <tr><td>reviewed</td><td>${esc(e.review.reviewed_at)}</td></tr>
       <tr><td>verdict</td><td>${esc(e.review.verdict)}${e.review.reason ? ` — ${esc(e.review.reason)}` : ""}</td></tr></table>`
    : '<p class="none">No review. Only <code>active</code> entries reach a headline.</p>';
  // The buttons record a read of *this* statement: the server binds the
  // verdict to the entry's digests as they stand on disk, so a verdict from a
  // stale tab is refused rather than approving something else.
  const named = reviewerName() !== "";
  const review = `${recorded}
    <div class="verdicts">
      <button class="faithful" data-verdict="faithful" ${named ? "" : "disabled"}>Faithful — checked by a human</button>
      <button class="unfaithful" data-verdict="unfaithful" ${named ? "" : "disabled"}>Unfaithful…</button>
      <span class="hint">${named ? "recorded as " + esc(reviewerName()) : "enter your name in the header to record a verdict"}</span>
    </div>`;

  box.innerHTML = `
    <h2>${esc(e.title || e.id)}</h2>
    <div class="sub"><code>${esc(e.id)}</code> · shard ${esc(e.shard)} · ${esc(e.difficulty)} ·
      ${e.expected === "false" ? `twin of <code>${esc(e.twin_of)}</code>` : "true"}</div>
    ${pane("Statement", `<div class="statement" id="stmt">${esc(e.input)}</div>`)}
    ${pane("Lean", `<pre class="lean">${esc(e.imports.map((i) => "import " + i).join("\n"))}\n\n${esc(e.declaration)}</pre>`)}
    ${pane("Classification", `<table class="kv">
      <tr><td>MSC2020</td><td>${codes}</td></tr>
      <tr><td>field</td><td>${esc(e.field)}</td></tr>
      <tr><td>reporting group</td><td>${esc(e.group)}</td></tr>
      <tr><td>arXiv</td><td>${esc(e.arxiv)}${e.arxiv_override ? ` <span class="warnline">(override: ${esc(e.override_reason)})</span>` : ""}</td></tr>
    </table>`)}
    ${pane("Provenance", occ)}
    ${pane("Non-vacuity", witness)}
    ${pane("Fixtures", e.fixtures.length
      ? `<div class="mono">${e.fixtures.map(esc).join(", ")}</div>`
      : '<p class="none">None.</p>')}
    ${pane("Review", review)}
    ${pane("Digest", `<div class="mono" style="font-size:.76rem;color:var(--dim)">statement ${esc(e.statement_digest)}</div>`)}
  `;
  renderMath($("stmt"));
  for (const button of box.querySelectorAll(".verdicts button")) {
    button.onclick = () => submitVerdict(e.id, button.dataset.verdict);
  }
  renderList();
}

// The reviewer's name lives in this browser only. Nothing here authenticates
// it: the server is loopback-bound and the name is provenance, not access.
function reviewerName() {
  try { return (localStorage.getItem("reviewer") || "").trim(); } catch (_) { return ""; }
}

function rememberReviewer() {
  try { localStorage.setItem("reviewer", $("reviewer").value.trim()); } catch (_) { /* no storage */ }
  renderDetail();
}

async function submitVerdict(id, verdict) {
  const reviewer = reviewerName();
  if (!reviewer) return;
  let reason = null;
  if (verdict === "unfaithful") {
    reason = window.prompt("Why is the Lean not the stated theorem? (recorded with the verdict)");
    if (reason === null || !reason.trim()) return;
  }
  let res;
  try {
    res = await fetch("/api/review", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, verdict, reviewer, reason }),
    });
  } catch (err) {
    window.alert("Could not reach the viewer server: " + err);
    return;
  }
  if (!res.ok) {
    let message = res.statusText;
    try { message = (await res.json()).error || message; } catch (_) { /* keep statusText */ }
    window.alert("Review refused: " + message);
    return;
  }
  await load();
}

async function load() {
  try {
    const res = await fetch("/api/corpus", { cache: "no-store" });
    DATA = await res.json();
  } catch (err) {
    $("status").className = "bad";
    $("status").textContent = "Could not reach the viewer server: " + err;
    return;
  }
  $("version").textContent = DATA.corpus_version ? "v" + DATA.corpus_version : "";
  const c = DATA.counts;
  $("counts").innerHTML = c.entries === undefined ? "" :
    `<b>${c.entries}</b> entries · <b>${c.twins}</b> twins · <b>${c.active}</b> active ·
     <b>${c.unwitnessed}</b> non-vacuity unchecked · <b>${c.unsourced}</b> unsourced`;
  const s = $("status");
  // A recorded review changes the content, so the manifest no longer matches
  // the changelog head: expected, and cleared by the release cut before a
  // push. It is shown as pending work, not as a broken corpus.
  const pending = DATA.issues.filter((i) => i.includes("manifest"));
  const objections = DATA.issues.filter((i) => !i.includes("manifest"));
  if (objections.length) {
    s.className = "bad";
    s.innerHTML = `<b>${objections.length} objection${objections.length > 1 ? "s" : ""} from <code>corpus check</code>:</b>
      <ul>${objections.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
  } else if (pending.length) {
    s.className = "pending";
    s.innerHTML = `corpus check: content changed since v${esc(DATA.corpus_version)} — a release is pending before the next push`;
  } else {
    s.className = "ok";
    s.textContent = "corpus check: clean";
  }
  $("reviewer").value = reviewerName();
  fillSelect($("fGroup"), [...new Set(DATA.entries.map((e) => e.group))].sort());
  fillSelect($("fStatus"), [...new Set(DATA.entries.map((e) => e.status))].sort());
  fillSelect($("fDifficulty"), [...new Set(DATA.entries.map((e) => e.difficulty))].sort());
  renderDetail();
}

for (const id of ["q", "fGroup", "fStatus", "fDifficulty", "fExpected"]) {
  $(id).addEventListener("input", renderList);
}
$("reviewer").addEventListener("change", rememberReviewer);
window.addEventListener("hashchange", renderDetail);
window.addEventListener("DOMContentLoaded", load);
load();
</script>
</body>
</html>
