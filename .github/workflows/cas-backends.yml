# Singular and Macaulay2 have no native Windows build between them, and Hardy
# must never require WSL. Linux CI is where those adapters get verified.
name: CAS backends

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/hardy/cas*.py"
      - "tests/**/test_cas*.py"
      - ".github/workflows/cas-backends.yml"

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Hermetic suite, with no CAS binary installed
        run: uv run --extra test pytest -q
      - name: Lint
        run: uvx ruff check src tests

  real-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Singular and Macaulay2
        run: |
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y singular macaulay2
      - name: Confirm both are reachable
        run: |
          Singular --version
          M2 --version
      - name: Real-backend tests
        run: uv run --extra test pytest tests/integration/test_cas_real.py -v -m real_toolchain
      - name: Debug sanitized M2 stdout (temporary, task-4 confirmation)
        run: |
          uv run python -c "
          from pathlib import Path
          import tempfile
          from hardy.cas import CasSession, backend_for
          from hardy.domain import RunLimits
          with tempfile.TemporaryDirectory() as d:
              session = CasSession(backend=backend_for('macaulay2'), command=None,
                  log_path=Path(d) / 'cells.jsonl', limits=RunLimits(cas_cell_seconds=60), cwd=Path(d))
              print('version:', repr(session.probe_version()))
              record = session.execute('R = QQ[x, y]; f = x^2 + y^2; f')
              print('status:', record.status)
              print('stdout:', repr(record.stdout))
              session.close()
          "
