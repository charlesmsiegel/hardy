# Singular and Macaulay2 have no native Windows build between them, and Hardy
# must never require WSL. Linux CI is where those adapters get verified.
name: CAS backends

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/hardy/**"
      - "tests/**/test_cas*.py"
      - ".github/workflows/cas-backends.yml"

jobs:
  # The hermetic suite and the lint used to run here too. `tests.yml` runs both
  # on every pull request rather than on this workflow's path filter, and on a
  # runner with no CAS binary installed either, so keeping them here only meant
  # running the same suite twice for a CAS-touching change.
  real-backends:
    # Pinned, image and packages both. The obsolete `-s` flag that broke the
    # first real run is the evidence that drift matters here: the adapter was
    # written against one Macaulay2 and met another. Pinned, a red run means
    # "we broke it" rather than "something moved". To move the pin, take the
    # noble version from https://launchpad.net/~macaulay2/+archive/ubuntu/macaulay2
    # and https://packages.ubuntu.com/noble/singular, and say so in the commit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Singular and Macaulay2
        run: |
          sudo add-apt-repository -y ppa:macaulay2/macaulay2
          sudo apt-get update
          sudo apt-get install -y \
            singular=1:4.3.2-p10+ds-1.1build1 \
            macaulay2=1.26.06+ds-2~ubuntu24.04.1
      - name: Confirm both are reachable
        run: |
          Singular --version
          M2 --version
      - name: Real-backend tests
        run: uv run --extra test pytest tests/integration/test_cas_real.py -v -m real_toolchain
