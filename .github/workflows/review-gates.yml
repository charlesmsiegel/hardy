name: review-gates
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
jobs:
  audit:
    name: review-gates
    runs-on: ubuntu-latest
    steps:
      - name: Require "Review gates" section or gates-override label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            if (labels.includes('gates-override')) {
              core.notice('gates-override label present — user sign-off recorded in PR timeline.');
              return;
            }
            const body = pr.body || '';
            if (/^#{1,6}\s*Review gates\b/im.test(body)) {
              core.notice('"Review gates" section found in PR description.');
              return;
            }
            core.setFailed(
              'PR description must include a "Review gates" section quoting the final ' +
              'verdicts of /codex:adversarial-review and /codex:review (see CLAUDE.md), ' +
              'or the user must apply the gates-override label as an auditable sign-off.'
            );
