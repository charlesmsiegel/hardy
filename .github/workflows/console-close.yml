# Native Windows Console Host transport and application shutdown acceptance.
name: Native console close acceptance

on:
  push:
    branches: [fix/t1-console-shutdown]
  pull_request:
    paths:
      - .github/workflows/console-close.yml
      - src/hardy/**
      - tests/unit/test_console_shutdown_native.py
      - tests/unit/test_windows_console_close.py
      - tests/fixtures/console/**

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      checkout-ref: ${{ github.sha }}
  native-console-close:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Select Windows Console Host for the desktop-close probe
        shell: pwsh
        run: |
          # Microsoft's Windows Console Host preference; Windows Terminal
          # supplies a PseudoConsoleWindow that cannot establish WM_CLOSE.
          # https://learn.microsoft.com/windows/terminal/group-policy#default-terminal-application
          $startup = 'HKCU:\Console\%%Startup'
          $consoleHost = '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}'
          New-Item -Path $startup -Force | Out-Null
          foreach ($name in @('DelegationConsole', 'DelegationTerminal')) {
            New-ItemProperty -Path $startup -Name $name -Value $consoleHost -PropertyType String -Force | Out-Null
          }
          Get-ItemProperty -Path $startup -Name DelegationConsole, DelegationTerminal
      - name: Observe real CTRL_CLOSE_EVENT and application cleanup
        env:
          HARDY_NATIVE_CONSOLE_CLOSE: "1"
        run: uv run --python 3.12 --extra test pytest -s -v tests/unit/test_windows_console_close.py tests/unit/test_console_shutdown.py tests/unit/test_console_shutdown_native.py -m "not real_toolchain and not live" --basetemp=console-probe-evidence
      - name: Keep native console diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-console-evidence
          path: console-probe-evidence/
          if-no-files-found: warn
