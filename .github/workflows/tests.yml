# The hermetic suite, on every change rather than on a path filter.
#
# `cas-backends.yml` runs the same suite, but only for pull requests that touch
# the CAS files it lists — so a change to the verifier, the runner, or the
# interactive session could reach main with nothing having run it. This runs
# unconditionally, and measures what the suite covers while it is at it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Hermetic suite, with coverage
        run: uv run --extra test pytest -q --cov --cov-report=xml --cov-report=html --cov-report=term
      - name: Lint
        run: uvx ruff check src tests
      # The manifest gate inside the tree can only compare two values from that
      # same tree, so editing a shard *and* rewriting the digest on the
      # existing heading passes it. The anchor has to come from outside: the
      # merge base's changelog head carries the version it released and the
      # manifest that version bound, which is the whole input.
      - name: Corpus release gate, against the merge base
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git show "origin/${{ github.base_ref }}:corpus/CHANGELOG.md" > /tmp/base-changelog.md 2>/dev/null; then
            # The registry is append-only, which no single tree can show:
            # deleting an entry *and* its key leaves live and issued matching.
            git show "origin/${{ github.base_ref }}:corpus/tombstones.json" > /tmp/base-tombstones.json
            uv run hardy evals corpus check \
              --since /tmp/base-changelog.md \
              --since-registry /tmp/base-tombstones.json
          else
            echo "no corpus on the base branch yet; nothing to anchor against"
          fi
      # Kept whether the run passed or failed: a suite that fell below the floor
      # is exactly when someone wants to read the report.
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          # A warning, not an error: the suite can fail before coverage writes
          # anything, and turning that into a second red step would bury the
          # first, which is the one that says what actually went wrong.
          if-no-files-found: warn

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build and exercise the installed wheel outside the checkout
        run: |
          set -euo pipefail
          uv build --wheel
          uv venv /tmp/hardy-wheel
          uv pip install --python /tmp/hardy-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/hardy-wheel/bin/python "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  # The whole axiom gate rests on two sentences of Lean's output. The hermetic
  # suite proves the parser reads them; only real Lean proves they are still
  # what Lean says. Those tests skip themselves without a toolchain, so before
  # this job they had never run anywhere -- an incompatible Lean could have
  # landed with nothing but the fake objecting.
  real-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          # `stable` rather than a pin, deliberately. This job exists to notice
          # when Lean's `#print axioms` wording moves; pinning would hide the
          # very change it is here to catch. A failure is a real answer.
          sh elan-init.sh -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Provision the Lean project
        run: |
          set -euo pipefail
          # Outside the checkout, the way a user's shared project is: the
          # tests find it through `HARDY_LEAN_PROJECT`, never by looking
          # inside the repository.
          HARDY_LEAN_PROJECT="$RUNNER_TEMP/lean_project"
          echo "HARDY_LEAN_PROJECT=$HARDY_LEAN_PROJECT" >> "$GITHUB_ENV"
          mkdir -p "$HARDY_LEAN_PROJECT"
          # Written by hand rather than with `lake new`, which lays out a
          # template this does not need. These tests elaborate standalone
          # sources with no imports, so no Mathlib and no library build: what
          # they need is a directory `lake env lean` will run in.
          printf 'leanprover/lean4:stable\n' > "$HARDY_LEAN_PROJECT/lean-toolchain"
          cat > "$HARDY_LEAN_PROJECT/lakefile.toml" <<'TOML'
          name = "hardy_project"
          TOML
          cd "$HARDY_LEAN_PROJECT" && lake update
      - name: Confirm the toolchain is really there
        run: |
          set -euo pipefail
          lake --version
          test -f "$HARDY_LEAN_PROJECT/lake-manifest.json"
      - name: The tests the fake cannot answer
        run: uv run --extra test pytest -q -m real_toolchain tests/integration/test_audit_real.py

  # `web/smoke.mjs` is the only end-to-end check on the browser client, and
  # until this job existed nothing ran it but a human remembering a two-shell
  # ritual. It drives the real built bundle against the real server, over the
  # scripted fake session `tests/unit/web_smoke_server.py` serves.
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      # `src/hardy/app/web/static/` is tracked in git and is what `hardy web`
      # actually serves -- it is not produced by this job. Every step below
      # rebuilds before smoking, which is structurally incapable of noticing
      # a bundle that was committed stale (source changed, `npm run build`
      # never run before the commit). This smokes the bundle exactly as
      # checked out, before anything here touches it, so that gap is caught
      # here instead of shipping.
      - name: Start the fake-session server (committed bundle)
        run: |
          set -euo pipefail
          uv run python tests/unit/web_smoke_server.py --port 8765 &
          echo $! > /tmp/web-smoke-server-committed.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/state > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the fake-session server never answered on :8765 within 30s" >&2
          exit 1
      - name: Smoke the committed bundle
        run: npm run smoke
        working-directory: web
      - name: Stop the fake-session server (committed bundle)
        if: always()
        run: |
          if [ -f /tmp/web-smoke-server-committed.pid ]; then
            kill "$(cat /tmp/web-smoke-server-committed.pid)" 2>/dev/null || true
          fi
      - name: Build the bundle
        run: npm run build
        working-directory: web
      # The gate the two smokes cannot provide between them. The committed
      # bundle is smoked above and the rebuilt one below, so a bundle
      # committed stale passes both whenever the source change falls outside
      # what the smoke asserts -- which is most source changes. This compares
      # what the build just produced against what was committed, and fails if
      # they differ, which is the only step here that can actually say the
      # tracked assets match the source they claim to be built from.
      #
      # `--stat` first so the log names the offending files before the exit
      # code ends the job; `--exit-code` is what fails it.
      - name: The committed bundle must match the source
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/hardy/app/web/static; then
            echo "::error::src/hardy/app/web/static/ is stale: rebuilding changed it." >&2
            echo "Run 'npm run build' in web/ and commit the result." >&2
            git diff --stat -- src/hardy/app/web/static >&2
            exit 1
          fi
      # Started in the background rather than with a separate long-running job
      # step, because `npm run smoke` needs it already listening. The wait
      # loop is bounded and fails the step with its own message on timeout --
      # the alternative, no wait at all, would have the smoke's own
      # connection-refused error stand in for "the server never came up",
      # which is a different failure than the ones the smoke actually checks.
      - name: Start the fake-session server (rebuilt bundle)
        run: |
          set -euo pipefail
          uv run python tests/unit/web_smoke_server.py --port 8765 &
          echo $! > /tmp/web-smoke-server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8765/api/state > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the fake-session server never answered on :8765 within 30s" >&2
          exit 1
      - name: Smoke the built bundle against it
        run: npm run smoke
        working-directory: web
      - name: Stop the fake-session server (rebuilt bundle)
        if: always()
        run: |
          if [ -f /tmp/web-smoke-server.pid ]; then
            kill "$(cat /tmp/web-smoke-server.pid)" 2>/dev/null || true
          fi

  hermetic-windows:
    name: hermetic suite on windows-latest
    runs-on: windows-latest
    continue-on-error: true   # remove once green
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Hermetic suite
        shell: pwsh
        run: uv run --python 3.12 --extra test pytest -q -m "not real_toolchain and not live" -rs -o faulthandler_timeout=300 --junitxml=windows-junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: windows-junit, path: windows-junit.xml, if-no-files-found: warn }
