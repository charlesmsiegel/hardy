# Publishes the artifacts the installers download, so that installing Hardy
# does not mean obtaining its repository.
#
# Three assets, all built here and never by hand:
#
#   hardy_prover-<version>-py3-none-any.whl   what goes into the virtual environment
#   hardy_prover-<version>.tar.gz             the source distribution
#   hardy-installers.tar.gz                   scripts/, so a standalone installer
#                                             can fetch the rest of itself
#
# The installer bundle carries no version in its name on purpose: that is what
# makes `releases/latest/download/hardy-installers.tar.gz` a URL anyone can curl
# without first knowing what the current release is. The versioned names are
# discovered from SHA256SUMS, which the installer downloads first and then
# checks every download against.
name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be cut, or re-cut, without pushing another tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release from (e.g. v0.1.0)"
        required: false
      dry-run:
        description: "Run the release gates and build, without publishing"
        type: boolean
        default: true
      candidate-ref:
        description: "Commit/ref to validate (dry runs only; defaults to tag)"
        required: false

permissions:
  contents: read

jobs:
  # Resolve once: a dispatch runs from the selected workflow branch, which can
  # differ from its requested tag. Every gate and the build consume this SHA.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the existing release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          CANDIDATE_REF: ${{ inputs.candidate-ref }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ] && [ -n "$CANDIDATE_REF" ]; then
            sha="$(git rev-parse --verify --end-of-options "$CANDIDATE_REF^{commit}")"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CANDIDATE_REF" ]; then
            echo "error: candidate-ref is permitted only for a dry run" >&2
            exit 1
          fi
          case "$TAG" in
            v*) ;;
            *) echo "error: release tags must start with v" >&2; exit 1 ;;
          esac
          git check-ref-format "refs/tags/$TAG"
          sha="$(git rev-parse --verify --end-of-options "refs/tags/$TAG^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  tests:
    needs: resolve
    uses: ./.github/workflows/tests.yml
    with:
      checkout-ref: ${{ needs.resolve.outputs.sha }}

  installers:
    needs: resolve
    uses: ./.github/workflows/installers.yml
    with:
      checkout-ref: ${{ needs.resolve.outputs.sha }}

  publish:
    needs: [resolve, tests, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: astral-sh/setup-uv@v5

      # A tag that disagrees with pyproject.toml would publish a wheel whose
      # version is not the one anyone asked for, and the mismatch would only
      # surface later as an installer downloading something unexpected.
      - name: Read the version and validate the release tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set -euo pipefail
          tag="$TAG"
          declared="$(python3 -c \
            'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$DRY_RUN" != true ] && [ "$tag" != "v$declared" ]; then
            echo "error: tag $tag does not match version $declared in pyproject.toml" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_ENV"

      - name: Build the wheel and the source distribution
        run: uv build --out-dir dist

      # scripts/ alone, not the whole tree: this is what a machine with no
      # clone unpacks in order to have an installer to run at all.
      - name: Bundle the installers
        run: tar czf dist/hardy-installers.tar.gz scripts

      # Named rather than globbed as `*`, so the manifest holds bare filenames
      # and cannot pick up a stray file left in dist/ by an earlier step.
      - name: Checksum every asset
        run: |
          set -euo pipefail
          cd dist
          sha256sum "hardy_prover-${{ env.version }}-py3-none-any.whl" \
                    "hardy_prover-${{ env.version }}.tar.gz" \
                    hardy-installers.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Published assets are immutable. `scripts/update.sh` decides whether
      # there is anything to do by comparing the release's version against the
      # installed one, so a tag whose wheel changed underneath it would leave
      # every existing installation quietly on the old code while reporting
      # success. Recovering a publish that failed before it uploaded anything is
      # the one thing this allows.
      # `gh release create` invents a tag on the default branch when the one it
      # is given does not exist, so a workflow_dispatch input naming a *branch*
      # would attach artifacts built from that branch to a tag pointing
      # somewhere else — a release whose recorded source is a fiction.
      - name: The ref released from must already be a tag
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha)"
          if [ "$current" != "${{ needs.resolve.outputs.sha }}" ]; then
            echo "error: $TAG moved after its release gates ran." >&2
            exit 1
          fi
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1 || {
            echo "error: $TAG is not a tag in this repository; releases are cut from tags only." >&2
            exit 1
          }

      - name: Publish the release
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$(gh release view "$TAG" --json assets --jq '.assets[].name')" ]; then
              echo "error: release $TAG already has assets, and a published release is not rewritten." >&2
              echo "Cut a new version instead: bump pyproject.toml and tag it." >&2
              exit 1
            fi
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "Hardy $TAG" \
              --generate-notes
          fi

      # The published release is what every installer will download, so read it
      # back rather than trusting that the upload did what it said.
      - name: Read the release back
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          published="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          echo "$published"
          for required in "hardy-installers.tar.gz" "SHA256SUMS" \
                          "hardy_prover-${{ env.version }}-py3-none-any.whl" \
                          "hardy_prover-${{ env.version }}.tar.gz"; do
            printf '%s\n' "$published" | grep -qx "$required" ||
              { echo "error: $required is missing from the release" >&2; exit 1; }
          done

      - name: Dry run passed without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "All release gates passed for ${{ needs.resolve.outputs.sha }}; no release or assets were published."
