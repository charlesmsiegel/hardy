[project]
name = "hardy"
version = "0.1.0"
description = "An agentic harness for theorem proving in Lean 4"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "lean: needs the pinned Lean toolchain and built REPL (run scripts/setup_lean.sh first)",
    "tex: needs tectonic on PATH",
    "docker: needs the hardy-lean:dev and hardy-tex:dev Docker images",
]
