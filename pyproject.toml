[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardy-prover"
version = "0.1.0"
description = "A thin experimental model-to-Lean proof loop"
requires-python = ">=3.11"
# Hardy authenticates as Claude Code does, through its agent SDK, so a Claude
# Max subscription works with no API key. The SDK drives the Claude Code CLI,
# which is a separate install (npm install -g @anthropic-ai/claude-code).
dependencies = ["claude-agent-sdk>=0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
hardy = "hardy.cli:main"

# The distribution is `hardy-prover` but the package is `hardy`, so the build
# backend cannot find it by name alone.
[tool.hatch.build.targets.wheel]
packages = ["src/hardy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
