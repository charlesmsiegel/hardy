[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardy-prover"
version = "0.1.0"
description = "An experimental agentic harness for mathematics in Lean 4"
requires-python = ">=3.11"
# Hardy authenticates as Claude Code does, through its agent SDK, so a Claude
# Max subscription works with no API key. The SDK drives the Claude Code CLI,
# which is a separate install (npm install -g @anthropic-ai/claude-code).
# Pydantic carries the frozen run values Hardy writes to disk, `mcp` serves
# the bounded Lean tools to clients other than the in-process agent SDK, and
# Jinja renders the prompt templates in hardy/prompts. prompt-toolkit is
# capped below its next minor: hardy/tui/shell.py and select.py patch five of
# its private internals (ANSI_SEQUENCES, _IS_PREFIX_OF_LONGER_MATCH_CACHE,
# Application._on_resize, Application._running_in_terminal, and
# Window.render_info), and only the resize guard has a test that would
# notice one of those breaking underneath an upgrade.
dependencies = [
    "claude-agent-sdk>=0.2",
    "pydantic>=2.9",
    "mcp>=1.28",
    "jinja2>=3.1",
    "prompt-toolkit>=3.0.50,<3.1",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=6"]
# The Codex backend is optional: Hardy runs on the Claude backend alone, and
# only a ChatGPT-subscription user needs this SDK installed.
codex = ["openai-codex>=0.144"]

[project.scripts]
hardy = "hardy.cli:main"

# The distribution is `hardy-prover` but the package is `hardy`, so the build
# backend cannot find it by name alone.
[tool.hatch.build.targets.wheel]
packages = ["src/hardy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_toolchain: invokes a real installed binary — pinned Lean, Tectonic, Singular, or Macaulay2",
    "live: invokes a billable model, an installer, or a third-party service over the network",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: the interactive and batch code states a tool spec or a printed line on
# one long line on purpose, and rewrapping them reads worse than it lints.
# UP042: `str, Enum` is deliberate — these values are written to disk and
# compared as strings by readers that never import Hardy.
ignore = ["E501", "UP042"]

# Half of Hardy's code is tests, and until this landed nothing said which of
# the invariants they cover. `uv run --extra test pytest --cov` writes
# `coverage.xml` and `htmlcov/`; CI keeps both as artifacts so a reviewer can
# see what a change did to the measured floor rather than guessing.
[tool.coverage.run]
# The importable package, not the source directory: coverage then finds it
# through the module path and reports the same numbers whether the project
# was installed editable or built into the environment.
source = ["hardy"]
branch = true
# `hardy.cas_driver` is the body of a helper *process*: the suite starts it
# with `subprocess`, so nothing here observes it and its 0% is a limit of the
# measurement rather than an absence of tests. Left in the report rather than
# omitted, because hiding it would raise the headline number by pretending the
# module is not there.

[tool.coverage.report]
show_missing = true
skip_covered = true
# A floor, not a target. It sits just under what the suite measures today, so
# it catches a change that drops coverage without failing on ordinary drift.
fail_under = 82
