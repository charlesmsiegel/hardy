[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardy-prover"
version = "0.1.0"
description = "A thin experimental model-to-Lean proof loop"
requires-python = ">=3.11"
# The OpenAI-compatible backend is stdlib urllib; the Claude backend uses
# Anthropic's official SDK and is imported lazily, so an install without it
# still runs everything else.
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
hardy = "hardy.cli:main"

# The distribution is `hardy-prover` but the package is `hardy`, so the build
# backend cannot find it by name alone.
[tool.hatch.build.targets.wheel]
packages = ["src/hardy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
